<!DOCTYPE html><html lang="te"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KMC 49 Ward SJ Survey</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f2f5fa;color:#17233a}header{background:#174a8b;color:white;text-align:center;padding:16px}h1{font-size:21px;margin:0}main{max-width:850px;margin:auto;padding:12px}section{background:white;padding:16px;border-radius:12px;margin-bottom:12px}h2{font-size:19px}input,select,button{display:block;width:100%;font-size:16px;padding:11px;margin:10px 0;border-radius:8px}input,select{border:1px solid #bdc9d8}button{background:#1765b6;color:white;border:0;font-weight:bold}button:disabled{opacity:.5}.hide{display:none}.msg{white-space:pre-line;padding:8px;background:#e7f1ff} .stats{display:flex;gap:8px}.stats div{flex:1;background:#eef4fc;text-align:center;padding:8px}.stats strong{display:block;font-size:20px}progress{width:100%}.list{line-height:2;word-break:break-word}.row{display:flex;gap:8px}.row button{flex:1}table{border-collapse:collapse;font-size:13px;width:100%}td,th{border-bottom:1px solid #ddd;padding:8px 4px;text-align:left}.scroll{overflow:auto}</style></head><body><header><h1>KMC 49 Ward SJ Survey</h1><p>వోటర్ సర్వే యాప్</p></header><main><section id="login"><h2>లాగిన్</h2><label>అసలు Gmail చిరునామా</label><input id="email" type="email" placeholder="example@gmail.com"><label>టీమ్</label><select id="role"><option value="">ఎంచుకోండి</option></select><label>Password</label><input id="password" type="password"><button id="loginBtn">లాగిన్</button><p id="loginMsg" class="msg"></p></section><div id="app" class="hide"><section><strong id="who"></strong><button id="logout">Logout</button></section><section id="entry"><h2>వోటర్ నంబర్ నమోదు</h2><label>Serial Number: 1 నుంచి 14,000</label><input id="number" type="number" inputmode="numeric" min="1" max="14000" step="1"><button id="save" disabled>Save చేయండి</button><p id="saveMsg" class="msg"></p></section><section><h2>సర్వే పురోగతి</h2><p id="status" class="msg">డేటా లోడ్ అవుతోంది...</p><div class="stats"><div><strong>14,000</strong>మొత్తం</div><div><strong id="count">--</strong>నమోదైనవి</div><div><strong id="remaining">--</strong>మిగిలినవి</div></div><progress id="progress" max="14000" value="0"></progress><p id="percentage"></p></section><section id="countsSection" class="hide"><h2>టీమ్ వారీగా నమోదైనవి</h2><div id="counts"></div></section><section><h2>నమోదు కాని నంబర్లు</h2><p>ఒక్కో పేజీలో 200 నంబర్లు</p><div id="missing" class="list"></div><div class="row"><button id="mprev">ముందు పేజీ</button><button id="mnext">తర్వాత పేజీ</button></div><p id="mpage"></p><button id="mcsv" disabled>నమోదు కాని నంబర్ల CSV Download</button></section><section><h2 id="recordTitle">నా టీమ్ రికార్డులు</h2><div id="filterBox" class="hide"><label>టీమ్ Filter</label><select id="filter"><option value="all">అన్ని టీమ్‌లు</option></select></div><p id="recordCount"></p><div class="scroll"><table><thead><tr><th>Serial No.</th><th>Team</th><th>తేదీ</th><th>సమయం</th></tr></thead><tbody id="rows"></tbody></table></div><div class="row"><button id="rprev">ముందు పేజీ</button><button id="rnext">తర్వాత పేజీ</button></div><p id="rpage"></p><button id="rcsv" disabled>రికార్డుల CSV Download</button></section></div></main><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js';
import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js';
import{getFirestore,collection,doc,onSnapshot,runTransaction,serverTimestamp}from'https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js';
const config={apiKey:'AIzaSyCVJ2La9QBaAyQIuRq3FXaYbubytx9brt0',authDomain:'kmc-49-ward-sj-survey.firebaseapp.com',projectId:'kmc-49-ward-sj-survey',storageBucket:'kmc-49-ward-sj-survey.firebasestorage.app',messagingSenderId:'883913577800',appId:'1:883913577800:web:7696735d1db7130f39cf7d'};
const ids=['liOl6jFdtyXLdqLkEekXVOIldWv2','53AlOJtU40YJFuN7X9mzrjBxH4p1','z3ygHDpwOoOnkM8AzrWFiIQ18P73','r7AkLuulzTQAfB0tfstyerb4a0O2','GGb9LMpm2uWtxvPqrYUTzMLtyEs1','3GBoVKjPvmassz8YlNWg6PdiDUZ2','cMJbzdQGSdaxt5UqdXRwZRg0o2A3','Rhn1MxU21JfOUlHYcyjDX8ykpV23','rdVudlRwabfETD1T1WRU8e1NMFq1','Sf39rD0soHUD1JSAH1HQrFdLJ0m1','fQvsinos57V3O4E0id2G5NPChD12','gDdnymuZDbbMSDJxRWH5UWrDbRC2','f0fCFrdfMoOwFmBUThkUeXrysqE2'];
const $=id=>document.getElementById(id);const fb=initializeApp(config),auth=getAuth(fb),db=getFirestore(fb);let current='',records=[],missing=[],mp=0,rp=0,ready=false,unsub=null,busy=false;
for(let i=1;i<=12;i++){ $('role').add(new Option('Team '+i,'team'+i));$('filter').add(new Option('Team '+i,'Team '+i));}$('role').add(new Option('Admin','admin'));
function controls(){$('save').disabled=!ready||busy;$('mcsv').disabled=!ready;$('rcsv').disabled=!ready}
function time(t){if(!t)return ['-','-'];let d=t.toDate();return [new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Kolkata',day:'2-digit',month:'2-digit',year:'numeric'}).format(d),new Intl.DateTimeFormat('en-IN',{timeZone:'Asia/Kolkata',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true}).format(d)]}
$('loginBtn').onclick=async()=>{let m=$('email').value.trim().toLowerCase().match(/^([^+@\s]+)@gmail\.com$/),role=$('role').value;if(!m||!role||!$('password').value){$('loginMsg').textContent='అసలు Gmail, టీమ్ మరియు Password నమోదు చేయండి.';return} $('loginBtn').disabled=true;try{await signInWithEmailAndPassword(auth,m[1]+'+'+role+'@gmail.com',$('password').value);$('password').value='';$('loginMsg').textContent=''}catch(e){$('loginMsg').textContent='లాగిన్ కాలేదు. Gmail, టీమ్, Password మరియు ఇంటర్నెట్ పరిశీలించండి.'}finally{$('loginBtn').disabled=false}};
$('logout').onclick=()=>signOut(auth);onAuthStateChanged(auth,async user=>{if(unsub){unsub();unsub=null}ready=false;records=[];missing=[];mp=rp=0;controls();if(!user){$('login').classList.remove('hide');$('app').classList.add('hide');return}let n=ids.indexOf(user.uid);if(n<0){await signOut(auth);$('loginMsg').textContent='ఈ అకౌంట్‌కు అనుమతి లేదు.';return}current=n===12?'Admin':'Team '+(n+1);$('login').classList.add('hide');$('app').classList.remove('hide');$('who').textContent='లాగిన్: '+current;$('entry').classList.toggle('hide',n===12);$('countsSection').classList.toggle('hide',n!==12);$('filterBox').classList.toggle('hide',n!==12);$('recordTitle').textContent=n===12?'అన్ని టీమ్‌ల రికార్డులు':'నా టీమ్ రికార్డులు';$('filter').value='all';$('status').textContent='డేటా లోడ్ అవుతోంది...';unsub=onSnapshot(collection(db,'voters'),{includeMetadataChanges:true},snap=>{records=snap.docs.map(d=>d.data());ready=!snap.metadata.fromCache&&!snap.metadata.hasPendingWrites;$('status').textContent=ready?'డేటా సర్వర్‌తో కనెక్ట్ అయింది.':'సర్వర్ కనెక్షన్ కోసం వేచి ఉంది. డేటా పాతదై ఉండవచ్చు.';render();controls()},e=>{ready=false;controls();$('status').textContent='డేటా లోడ్ కాలేదు: '+e.code})});
$('save').onclick=async()=>{let raw=$('number').value.trim(),n=Number(raw);if(!/^\d+$/.test(raw)||!Number.isInteger(n)||n<1||n>14000){$('saveMsg').textContent='1 నుంచి 14,000 మధ్య పూర్ణసంఖ్య నమోదు చేయండి.';return}busy=true;controls();try{let ref=doc(db,'voters',String(n));let found=await runTransaction(db,async t=>{let old=await t.get(ref);if(old.exists())return old.data();t.set(ref,{serialNumber:n,team:current,createdAt:serverTimestamp()});return null});if(found){let [d,t]=time(found.createdAt);$('saveMsg').textContent=`ఈ నంబర్ ఇప్పటికే నమోదైంది.\nSerial Number: ${n}\nటీమ్: ${found.team}\nతేదీ: ${d}\nసమయం: ${t}`}else{$('saveMsg').textContent=`Serial Number ${n} విజయవంతంగా నమోదైంది.`;$('number').value=''}}catch(e){$('saveMsg').textContent='Save కాలేదు. ఇంటర్నెట్ లేదా Rules పరిశీలించండి. ('+(e.code||'error')+')'}finally{busy=false;controls()}};
function selected(){let a=records.filter(r=>current==='Admin'?$('filter').value==='all'||r.team===$('filter').value:r.team===current);return a.sort((a,b)=>(a.createdAt?.toMillis()||0)-(b.createdAt?.toMillis()||0)||a.serialNumber-b.serialNumber)}
function render(){let set=new Set(records.map(r=>r.serialNumber));missing=[];for(let i=1;i<=14000;i++)if(!set.has(i))missing.push(i);$('count').textContent=set.size.toLocaleString('en-IN');$('remaining').textContent=missing.length.toLocaleString('en-IN');$('progress').value=set.size;$('percentage').textContent='పురోగతి: '+(100*set.size/14000).toFixed(2)+'%';if(current==='Admin'){$('counts').innerHTML='';for(let i=1;i<=12;i++){let el=document.createElement('p');el.textContent='Team '+i+': '+records.filter(r=>r.team==='Team '+i).length;$('counts').append(el)}}showMissing();showRecords()}
function showMissing(){let pages=Math.max(1,Math.ceil(missing.length/200));mp=Math.max(0,Math.min(mp,pages-1));$('missing').textContent=missing.slice(mp*200,mp*200+200).join(', ')||'అన్ని నంబర్లు నమోదయ్యాయి.';$('mpage').textContent=`పేజీ ${mp+1} / ${pages}`;$('mprev').disabled=mp===0;$('mnext').disabled=mp===pages-1}
function showRecords(){let a=selected(),pages=Math.max(1,Math.ceil(a.length/50));rp=Math.max(0,Math.min(rp,pages-1));$('recordCount').textContent='రికార్డుల సంఖ్య: '+a.length;$('rows').innerHTML='';a.slice(rp*50,rp*50+50).forEach(r=>{let tr=document.createElement('tr');[r.serialNumber,r.team,...time(r.createdAt)].forEach(x=>{let td=document.createElement('td');td.textContent=x;tr.append(td)});$('rows').append(tr)});$('rpage').textContent=`పేజీ ${rp+1} / ${pages}`;$('rprev').disabled=rp===0;$('rnext').disabled=rp===pages-1}
$('mprev').onclick=()=>{mp--;showMissing()};$('mnext').onclick=()=>{mp++;showMissing()};$('rprev').onclick=()=>{rp--;showRecords()};$('rnext').onclick=()=>{rp++;showRecords()};$('filter').onchange=()=>{rp=0;showRecords()};
function csv(name,rows){let content='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');let url=URL.createObjectURL(new Blob([content],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('mcsv').onclick=()=>{if(ready)csv('not-registered-numbers.csv',[['Serial Number'],...missing.map(n=>[n])])};$('rcsv').onclick=()=>{if(ready)csv('survey-records.csv',[['Serial Number','Team','Date','Time'],...selected().map(r=>[r.serialNumber,r.team,...time(r.createdAt)])])};
</script></body></html>
